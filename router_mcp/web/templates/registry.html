{% extends "base.html" %}
{% block title %}Реестр — Model Router{% endblock %}
{% block content %}
<section class="card">
  <h2>Поставщики сервиса</h2>
  <table id="providers"><thead><tr>
    <th>ID</th><th>Название</th><th>Адаптер</th><th>Включён</th>
  </tr></thead><tbody></tbody></table>
</section>

<section class="card">
  <h2>Добавить модель вручную</h2>
  <div class="row">
    <label>Поставщик сервиса <input id="m-sp" placeholder="openrouter"></label>
    <label class="grow">model_id <input id="m-id" placeholder="provider/model"></label>
    <label>Поставщик модели <input id="m-mp" placeholder="(авто)"></label>
  </div>
  <div class="row">
    <label class="grow">Название <input id="m-name"></label>
    <label>Модальности <input id="m-mods" value="chat"></label>
  </div>
  <div class="row">
    <label>prompt_price <input id="m-pp" type="number" step="any" value="0"></label>
    <label>completion_price <input id="m-cp" type="number" step="any" value="0"></label>
    <label>image_price <input id="m-ip" type="number" step="any" value="0"></label>
    <label>audio/сек <input id="m-ap" type="number" step="any" value="0"></label>
  </div>
  <div class="row">
    <label>Режим цены
      <select id="m-mode">
        <option value="per_request">per_request</option>
        <option value="amortized_subscription">amortized_subscription</option>
      </select>
    </label>
    <button id="m-add" type="button" class="primary">Добавить</button>
  </div>
</section>

<section class="card">
  <h2>Модели реестра</h2>
  <div class="row">
    <label>Источник
      <select id="f-source">
        <option value="">все</option>
        <option value="manual">manual</option>
        <option value="catalog">catalog</option>
      </select>
    </label>
    <button id="reload" type="button">Обновить</button>
  </div>
  <table id="models"><thead><tr>
    <th>Поставщик</th><th>model_id</th><th>Модальности</th><th>Tier</th>
    <th>prompt</th><th>completion</th><th>Источник</th><th></th>
  </tr></thead><tbody></tbody></table>
</section>
{% endblock %}
{% block script %}
<script>
async function loadProviders() {
  const ps = await api('/api/registry/providers');
  const tb = document.querySelector('#providers tbody');
  tb.innerHTML = '';
  for (const p of ps) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.id}</td><td>${p.display_name}</td><td>${p.adapter}</td>`;
    const td = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = p.enabled;
    cb.addEventListener('change', () =>
      api(`/api/registry/providers/${p.id}`, { method: 'PATCH', body: { enabled: cb.checked } })
        .then(() => toast('Сохранено')));
    td.appendChild(cb); tr.appendChild(td); tb.appendChild(tr);
  }
}

async function loadModels() {
  const source = document.getElementById('f-source').value;
  const q = new URLSearchParams(); if (source) q.set('source', source);
  const models = await api('/api/registry/models?' + q);
  const tb = document.querySelector('#models tbody');
  tb.innerHTML = '';
  for (const m of models.slice(0, 1000)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${m.service_provider}</td><td>${m.model_id}</td>` +
      `<td>${m.modalities.join(',')}</td><td>${m.tier}</td>` +
      `<td>${m.prompt_price}</td><td>${m.completion_price}</td><td>${m.source}</td>`;
    const td = document.createElement('td');
    if (m.source === 'manual') {
      const btn = document.createElement('button');
      btn.textContent = '✕';
      btn.addEventListener('click', async () => {
        await api(`/api/registry/models?service_provider_id=${encodeURIComponent(m.service_provider)}&model_id=${encodeURIComponent(m.model_id)}`, { method: 'DELETE' });
        loadModels();
      });
      td.appendChild(btn);
    }
    tr.appendChild(td); tb.appendChild(tr);
  }
  toast(`Моделей: ${models.length}`);
}

async function addModel() {
  const body = {
    service_provider_id: document.getElementById('m-sp').value.trim(),
    model_id: document.getElementById('m-id').value.trim(),
    model_provider: document.getElementById('m-mp').value.trim() || null,
    display_name: document.getElementById('m-name').value.trim(),
    modalities: document.getElementById('m-mods').value.split(',').map(s => s.trim()).filter(Boolean),
    prompt_price: parseFloat(document.getElementById('m-pp').value) || 0,
    completion_price: parseFloat(document.getElementById('m-cp').value) || 0,
    image_price: parseFloat(document.getElementById('m-ip').value) || 0,
    audio_price_per_second: parseFloat(document.getElementById('m-ap').value) || 0,
    pricing_mode: document.getElementById('m-mode').value,
  };
  if (!body.service_provider_id || !body.model_id) { toast('Укажите поставщика и model_id', true); return; }
  await api('/api/registry/models', { method: 'POST', body });
  toast('Модель добавлена'); loadModels();
}

document.getElementById('reload').addEventListener('click', loadModels);
document.getElementById('m-add').addEventListener('click', addModel);
loadProviders(); loadModels();
</script>
{% endblock %}
