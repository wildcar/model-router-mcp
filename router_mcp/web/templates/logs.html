{% extends "base.html" %}
{% block title %}Логи — Model Router{% endblock %}
{% block content %}
<section class="card">
  <h2>Статистика по пользователям</h2>
  <table id="usage"><thead><tr>
    <th>Пользователь</th><th>Запросов</th><th>Токенов</th><th>Стоимость, $</th>
  </tr></thead><tbody></tbody></table>
</section>

<section class="card">
  <h2>Журнал запросов</h2>
  <div class="row">
    <label>Пользователь <input id="f-user" placeholder="(все)"></label>
    <label>Лимит <input id="f-limit" type="number" value="50"></label>
    <button id="reload" type="button">Обновить</button>
  </div>
  <table id="logs"><thead><tr>
    <th>id</th><th>Время</th><th>Пользователь</th><th>Модель</th><th>Мод.</th>
    <th>Статус</th><th>Токены</th><th>$</th><th>Запрос</th>
  </tr></thead><tbody></tbody></table>
</section>
{% endblock %}
{% block script %}
<script>
async function loadUsage() {
  const rows = await api('/api/usage');
  const tb = document.querySelector('#usage tbody');
  tb.innerHTML = '';
  for (const r of rows) {
    tb.appendChild(row([
      r.external_user_id,
      r.requests,
      r.total_tokens,
      (r.total_cost_usd ?? 0).toFixed(6),
    ]));
  }
}

async function loadLogs() {
  const user = document.getElementById('f-user').value.trim();
  const limit = document.getElementById('f-limit').value || 50;
  const q = new URLSearchParams({ limit }); if (user) q.set('user', user);
  const rows = await api('/api/logs?' + q);
  const tb = document.querySelector('#logs tbody');
  tb.innerHTML = '';
  for (const r of rows) {
    // A substituted model and an estimated price both have to be visible here:
    // the log is where a surprising bill gets explained.
    const model = r.requested_model_id
      ? el('span', `${r.model_id ?? '–'} ⇄`,
           { title: `Запрошена ${r.requested_model_id}: ${r.fallback_reason || ''}` })
      : el('span', r.model_id ?? '–');
    const cost = el('span', (r.cost_usd ?? 0).toFixed(6));
    if (r.cost_source === 'estimated') {
      cost.appendChild(el('span', ' ≈', { title: 'Цена модели не подтверждена' }));
    }
    tb.appendChild(row([
      r.id,
      r.created_at,
      r.external_user_id,
      { node: model },
      r.modality,
      r.status === 'ok' ? r.status : el('td', r.status, { className: 'err' }),
      r.total_tokens ?? '–',
      { node: cost },
      { text: (r.request_text || '').slice(0, 60), className: 'trunc',
        title: r.request_text || '' },
    ]));
  }
}

function reload() { loadUsage(); loadLogs(); }
document.getElementById('reload').addEventListener('click', reload);
reload();
</script>
{% endblock %}
