{% extends "base.html" %}
{% block title %}Логи — Model Router{% endblock %}
{% block content %}
<section class="card">
  <h2>Статистика по пользователям</h2>
  <table id="usage"><thead><tr>
    <th>Метка пользователя</th><th class="num">Запросов</th>
    <th class="num">Токенов</th><th class="num">Стоимость, $</th>
  </tr></thead><tbody></tbody></table>
</section>

<section class="card" id="detail" hidden></section>

<section class="card">
  <h2>Журнал запросов</h2>
  <div class="row">
    <label>Метка пользователя <input id="f-user" placeholder="(все)"></label>
    <label>Статус
      <select id="f-status">
        <option value="">все</option>
        <option value="ok">ok</option>
        <option value="error">ошибка</option>
      </select>
    </label>
    <label>Модальность
      <select id="f-modality">
        <option value="">все</option>
        <option value="chat">chat</option>
        <option value="image">image</option>
        <option value="stt">stt</option>
        <option value="tts">tts</option>
        <option value="cli">cli</option>
      </select>
    </label>
    <label>Канал
      <select id="f-channel">
        <option value="">все</option>
        <option value="ui">консоль</option>
        <option value="api">API</option>
        <option value="mcp">MCP</option>
      </select>
    </label>
    <button id="reload" type="button">Обновить</button>
  </div>
  <div class="row">
    <label><input id="f-fallback" type="checkbox"> с подстановкой</label>
    <label><input id="f-retries" type="checkbox"> были повторы</label>
    <label><input id="f-unverified" type="checkbox"> цена не подтверждена</label>
  </div>
  <table id="logs"><thead><tr>
    <th class="num">id</th><th>Время</th><th>Метка</th><th>Модель</th><th>Мод.</th>
    <th>Канал</th><th>Статус</th><th class="num">Время ответа</th>
    <th class="num">Токены</th><th class="num">$</th><th>Запрос</th>
  </tr></thead><tbody></tbody></table>
  <div class="row">
    <span id="count" class="hint"></span>
    <span id="tz" class="hint"></span>
    <button id="more" type="button" hidden>Ещё 50</button>
  </div>
</section>
{% endblock %}
