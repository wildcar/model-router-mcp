<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Model Router{% endblock %}</title>
  {# ?v= is the app version: after a restart the browser must not keep running
     yesterday's client against today's API. #}
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body>
  <header>
    <h1>Model Router MCP</h1>
    <nav>
      <a href="/" class="{{ 'active' if active == 'test' else '' }}">Тестирование</a>
      <a href="/registry" class="{{ 'active' if active == 'registry' else '' }}">Реестр</a>
      <a href="/logs" class="{{ 'active' if active == 'logs' else '' }}">Логи</a>
      <span class="spacer"></span>
      <a href="/mcp" title="MCP Streamable HTTP endpoint">/mcp</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {# No page carries logic in a <script> block: templates are markup, behaviour
     lives in static/js/pages/*.js as native ES modules (§18). #}
  {% if page_script %}
  <script type="module" src="/static/js/pages/{{ page_script }}.js?v={{ version }}"></script>
  {% endif %}
</body>
</html>
