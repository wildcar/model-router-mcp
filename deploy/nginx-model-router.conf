# nginx reverse proxy for model-router-mcp.
# Replace router.example.com with your subdomain, then run certbot --nginx.
#
#   sudo cp deploy/nginx-model-router.conf /etc/nginx/sites-available/model-router
#   sudo ln -s /etc/nginx/sites-available/model-router /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/model-router.htpasswd <web-user>
#   sudo certbot --nginx -d router.example.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream model_router {
    server 127.0.0.1:8088;
}

server {
    listen 80;
    server_name router.example.com;
    # certbot will add the TLS server block and redirect 80 -> 443.

    # MCP Streamable HTTP: app-level Bearer token (AUTH_TOKEN), streaming-safe.
    location /mcp {
        proxy_pass http://model_router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # keep-alive; no upgrade hop
        proxy_buffering off;                      # do not buffer SSE/streamed bodies
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check: open, for monitoring.
    location = /health {
        proxy_pass http://model_router;
        proxy_set_header Host $host;
    }

    # CLI runs take up to CLI_RUN_TIMEOUT_SEC (1800s by default), far past the
    # 60s nginx applies when proxy_read_timeout is unset: without this block a
    # long `codex`/`claude` run answers 504 while the subprocess keeps going.
    # /api/runs is the future run-registry endpoint; same timing applies.
    # Both prefixes are matched: /api/v1 is the contract, bare /api is kept for
    # pages loaded before a restart.
    location ~ ^/api/(v1/)?(cli|runs) {
        auth_basic "Model Router";
        auth_basic_user_file /etc/nginx/model-router.htpasswd;
        proxy_pass http://model_router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                       # progress/streamed bodies
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web console + JSON API + static + blobs: guarded by HTTP Basic auth.
    location / {
        auth_basic "Model Router";
        auth_basic_user_file /etc/nginx/model-router.htpasswd;
        proxy_pass http://model_router;
        # Image generation allows 180s per attempt plus a retry; the 60s default
        # would cut it off mid-request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 50m;   # uploads (audio for STT in later phases)
}
