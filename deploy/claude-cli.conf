# systemd drop-in for model-router-mcp.service — CLI engines support.
# Install to: /etc/systemd/system/model-router-mcp.service.d/claude-cli.conf
#
# The unit's ProtectHome=true masks all of /home, so the service gets a
# dedicated writable HOME. claude is installed natively inside it
# (.local/share/claude/versions/<v> + .local/bin/claude symlink) and is found
# via the $HOME/.local/bin fallback in adapters/_subprocess.resolve_executable.
# CLI runs execute in $HOME/workspace (CLI_DEFAULT_CWD / CLI_ALLOWED_CWD_ROOTS
# in the prod .env) — a dedicated empty dir, also the CLI's trusted folder.
[Service]
Environment=HOME=/var/lib/model-router/home
ReadWritePaths=/var/lib/model-router/home
